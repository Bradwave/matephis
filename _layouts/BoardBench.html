<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>{%- if page.title -%}{{ page.title }} - {%- endif -%}{{ site.heading }}</title>
    {%- if site.favicon -%}
    <link rel="icon" href="{{ site.baseurl }}{{ site.favicon }}" type="image/svg+xml" sizes="any" />
    {%- endif -%}
    {%- if site.css_file -%}
    <link href="{{ site.baseurl }}{{ site.css_file }}?v=2.18" rel="stylesheet" media="all" class="default" />
    {%- else -%}
    <link href="{{ site.baseurl }}/assets/css/style.css?v=2.18" rel="stylesheet" media="all" class="default" />
    {%- endif -%}
    <link href="{{ site.baseurl }}/assets/css/matephis-board.css?v=0.18" rel="stylesheet" />
</head>

<body class="bench-body" data-baseurl="{{ site.baseurl }}">
    {{ content }}
    {%- comment -%} Engine cache versions for the board's engine loader (_data/engines.yml), as data:
    a JSON block never runs, so the board's CSP needs no inline script for it {%- endcomment -%}
    <script type="application/json" id="matephis-engine-versions">{{ site.data.engines | jsonify }}</script>
    <script src="{{ site.baseurl }}/assets/js/matephis-board-bench.js?v=4"></script>
</body>

</html>
