<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>{%- if page.title -%}{{ page.title }} - {%- endif -%}{{ site.heading }}</title>
    {%- if site.favicon -%}
    <link rel="icon" href="{{ site.baseurl }}{{ site.favicon }}" type="image/svg+xml" sizes="any" />
    {%- endif -%}
    {%- if site.css_file -%}
    <link href="{{ site.baseurl }}{{ site.css_file }}?v=2.16" rel="stylesheet" media="all" class="default" />
    {%- else -%}
    <link href="{{ site.baseurl }}/assets/css/style.css?v=2.16" rel="stylesheet" media="all" class="default" />
    {%- endif -%}
    <link href="{{ site.baseurl }}/assets/css/matephis-board.css?v=0.16" rel="stylesheet" />
</head>

<body class="bench-body" data-baseurl="{{ site.baseurl }}">
    {{ content }}
    <script src="{{ site.baseurl }}/assets/js/matephis-board-bench.js?v=1"></script>
</body>

</html>
