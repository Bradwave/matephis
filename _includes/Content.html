<div class="content">
    {{ content | markdownify }}
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const contentDiv = document.querySelector('.content');
    if (!contentDiv) return;

    const INDEX_URL = "{{ site.baseurl }}/assets/notes-graph.json?v={{ site.time | date: '%s' }}";

    fetch(INDEX_URL)
        .then(function(res) {
            if (!res.ok) throw new Error('Graph HTTP ' + res.status);
            return res.json();
        })
        .then(function(graph) {
            const currentSlug = "{{ page.url | split: '/' | last | remove: '.html' }}".toLowerCase();
            const currentTitle = "{{ page.title | escape }}".toLowerCase();

            // 1. Process Wikilinks in Content text nodes safely
            function processWikiLinks(node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    let parent = node.parentElement;
                    while (parent) {
                        if (parent.tagName === 'CODE' || parent.tagName === 'PRE' || 
                            parent.tagName === 'MJX-CONTAINER' ||
                            parent.classList.contains('highlighter-rouge') || 
                            parent.classList.contains('highlight')) {
                            return;
                        }
                        parent = parent.parentElement;
                    }

                    const text = node.textContent;
                    const regex = /\[\[([^\]]+)\]\]/g;
                    let match;
                    let lastIndex = 0;
                    const fragments = [];

                    while ((match = regex.exec(text)) !== null) {
                        if (match.index > lastIndex) {
                            fragments.push(document.createTextNode(text.slice(lastIndex, match.index)));
                        }

                        const raw = match[1];
                        let title = raw;
                        let extUrl = null;
                        let customLabel = null;

                        if (raw.includes('::')) {
                            const parts = raw.split('::');
                            title = parts[0].trim();
                            extUrl = parts[1].trim();
                        } else if (raw.includes('|')) {
                            const parts = raw.split('|');
                            title = parts[0].trim();
                            customLabel = parts[1].trim();
                        }

                        const display = customLabel || title;
                        const span = document.createElement('span');
                        span.className = 'link-wrapper';
                        const a = document.createElement('a');

                        if (extUrl) {
                            a.href = extUrl;
                            a.target = '_blank';
                            a.rel = 'noopener';
                            a.className = 'external-link';
                            a.textContent = display;
                        } else {
                            // Find note in graph by slug or title
                            const targetKey = title.toLowerCase();
                            let targetNote = graph[targetKey];
                            if (!targetNote) {
                                for (let k in graph) {
                                    if (graph[k].title && graph[k].title.toLowerCase() === targetKey) {
                                        targetNote = graph[k];
                                        break;
                                    }
                                }
                            }

                            if (targetNote) {
                                a.href = targetNote.url;
                                a.textContent = display;
                                a.className = 'wiki-link';

                                a.addEventListener('mouseenter', function() {
                                    showPreview(this, targetNote.title, targetNote.excerpt);
                                });
                                a.addEventListener('mouseleave', hidePreview);
                            } else {
                                a.href = 'javascript:void(0)';
                                a.textContent = display;
                                a.className = 'stale-link';
                                a.title = 'Appunto non trovato: ' + title;
                            }
                        }

                        span.appendChild(a);
                        fragments.push(span);
                        lastIndex = match.index + match[0].length;
                    }

                    if (lastIndex < text.length) {
                        fragments.push(document.createTextNode(text.slice(lastIndex)));
                    }

                    if (fragments.length > 0) {
                        const p = node.parentNode;
                        fragments.forEach(function(f) { p.insertBefore(f, node); });
                        p.removeChild(node);
                    }
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    Array.from(node.childNodes).forEach(processWikiLinks);
                }
            }

            processWikiLinks(contentDiv);

            // 2. Render Backlinks if container exists
            const backlinksContainer = document.getElementById('jekyll-seamless-backlinks-list');
            const backlinksSection = document.getElementById('jekyll-seamless-backlinks');
            if (backlinksContainer && backlinksSection) {
                let noteMeta = graph[currentSlug];
                if (!noteMeta) {
                    for (let k in graph) {
                        if (graph[k].title && graph[k].title.toLowerCase() === currentTitle) {
                            noteMeta = graph[k];
                            break;
                        }
                    }
                }

                if (noteMeta && noteMeta.backlinks && noteMeta.backlinks.length > 0) {
                    backlinksContainer.innerHTML = '';
                    noteMeta.backlinks.forEach(function(bl) {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.href = bl.url;
                        a.textContent = bl.title;
                        li.appendChild(a);
                        backlinksContainer.appendChild(li);
                    });
                    backlinksSection.classList.remove('hide');
                    backlinksSection.classList.add('show');
                }
            }
        })
        .catch(function(err) {
            console.warn('Notes graph could not be loaded:', err);
        });

    function showPreview(link, title, excerpt) {
        hidePreview();
        const preview = document.createElement('div');
        preview.className = 'link-preview';
        preview.innerHTML = '<div class="preview-content"><strong>' + title + '</strong><p>' + excerpt + '</p></div>';
        document.body.appendChild(preview);

        const rect = link.getBoundingClientRect();
        preview.style.position = 'fixed';
        preview.style.left = Math.min(rect.left, window.innerWidth - 320) + 'px';
        preview.style.top = (rect.bottom + 6) + 'px';
        preview.style.zIndex = '1000';
    }

    function hidePreview() {
        const p = document.querySelector('.link-preview');
        if (p) p.remove();
    }
});
</script>
